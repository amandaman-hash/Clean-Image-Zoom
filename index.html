<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean Images: image search without the clutter</title>
<meta name="description" content="Free bookmarklet that removes captions, prices and icons from image search grids and opens full-resolution images with scroll-wheel zoom and drag to pan.">
<meta property="og:title" content="Clean Images">
<meta property="og:description" content="Image search results with no captions, prices or icons. Click any image for full resolution, then scroll to zoom.">
<meta property="og:type" content="website">
<style>
  :root{
    --blue:#1a73e8; --red:#ea4335; --yellow:#fbbc04; --green:#34a853;
    --text:#202124; --muted:#5f6368; --line:#dadce0; --soft:#f8f9fa;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#fff;color:var(--text);display:flex;flex-direction:column;min-height:100vh;
       font:16px/1.55 "Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline}
  code{background:#fff;padding:2px 6px;border-radius:4px;font-size:.9em;border:1px solid var(--line)}

  .bar{height:5px;flex:none;background:linear-gradient(90deg,var(--blue) 0 25%,var(--red) 25% 50%,var(--yellow) 50% 75%,var(--green) 75% 100%)}
  header{flex:none;display:flex;align-items:center;justify-content:space-between;
         width:100%;max-width:1200px;margin:0 auto;padding:14px 32px}
  .logo{font-size:1.25rem;font-weight:500;color:var(--text)}
  .gh{color:var(--muted);font-size:.95rem}

  main{flex:1;display:flex;flex-direction:column;justify-content:center}
  .hero{width:100%;max-width:1200px;margin:0 auto;padding:24px 32px 32px;
        display:grid;grid-template-columns:1.15fr 1fr;gap:64px;align-items:center}
  h1{font-size:3rem;line-height:1.1;font-weight:400;margin:0 0 16px;letter-spacing:-.5px}
  h1 b{font-weight:500;color:var(--blue)}
  .lead{font-size:1.15rem;color:var(--muted);margin:0 0 22px;max-width:520px}
  .steps{list-style:none;margin:0;padding:0;counter-reset:s}
  .steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;margin-bottom:11px}
  .steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;
       background:var(--soft);border:1px solid var(--line);color:var(--blue);
       font-weight:500;text-align:center;line-height:26px;font-size:.9rem}

  .panel{background:var(--soft);border:1px solid var(--line);border-radius:28px;
         padding:36px 28px 28px;text-align:center}
  .go{display:inline-flex;align-items:center;justify-content:center;
      width:170px;height:170px;border-radius:50%;background:var(--blue);color:#fff;
      font-size:1.7rem;font-weight:500;cursor:grab;text-decoration:none;
      box-shadow:0 0 0 12px rgba(26,115,232,.12),0 0 0 26px rgba(26,115,232,.06),0 10px 30px rgba(26,115,232,.35);
      transition:transform .15s}
  .go:hover{transform:scale(1.04);text-decoration:none}
  .panel strong{display:block;color:var(--text);font-size:1.05rem;font-weight:500;margin-top:30px}
  .panel .sub{margin:6px 0 0;color:var(--muted);font-size:.92rem}
  details{margin-top:14px;text-align:left}
  summary{cursor:pointer;color:var(--blue);font-size:.92rem;text-align:center;list-style:none}
  summary::-webkit-details-marker{display:none}
  details p{margin:10px 0 8px;color:var(--muted);font-size:.85rem}
  textarea{width:100%;height:80px;border:1px solid var(--line);border-radius:10px;
           padding:10px;font:11px monospace;color:var(--text);background:#fff;resize:vertical}

  .band{flex:none;background:var(--soft);border-top:1px solid var(--line)}
  .wrap{width:100%;max-width:1200px;margin:0 auto;padding:18px 32px 20px}
  .label{margin:0 0 12px;font-size:1.05rem;font-weight:500}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px}
  .card i{display:block;width:32px;height:5px;border-radius:3px;margin-bottom:10px}
  .card h3{margin:0 0 2px;font-size:1rem;font-weight:500}
  .card p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.4}

  footer{flex:none;width:100%;max-width:1200px;margin:0 auto;padding:12px 32px 16px;color:var(--muted);font-size:.82rem}

  @media (max-height:820px){
    h1{font-size:2.5rem;margin-bottom:12px}
    .lead{margin-bottom:16px;font-size:1.05rem}
    .steps li{margin-bottom:8px}
    .hero{padding-top:12px;padding-bottom:20px}
    .go{width:140px;height:140px;font-size:1.5rem}
    .panel{padding:28px 24px 20px}
    .panel strong{margin-top:24px}
  }
  @media (max-width:900px){
    html,body{height:auto}
    .hero{grid-template-columns:1fr;gap:32px;padding-top:24px}
    h1{font-size:2.4rem}
    .cards{grid-template-columns:1fr 1fr}
